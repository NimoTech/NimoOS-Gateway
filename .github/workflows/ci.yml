name: CI

# Build, vet and test on every pull request, and on main so a bad merge shows up
# immediately rather than surprising the next person to open a PR.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here publishes anything. A token that cannot write is one
# that cannot be misused by a compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A single checkout is enough. go.mod used to redirect
      # github.com/NimoTech/NimoOS-Common to ../NimoOS-Common, so CI had to
      # clone that sibling — with a token, because it was private. The
      # dependency is an ordinary published module now, so there is no sibling
      # to reproduce and no secret to hand out.
      #
      # That also makes this job build the same way an outside contributor's
      # clone does. Nothing here has access to a local NimoOS-Common, so if
      # go.mod ever names a version that does not exist or is too old, CI is
      # where it surfaces.
      - name: Check out NimoOS-Gateway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Take the toolchain from go.mod so this workflow cannot drift from what
      # the module actually declares.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pure Go, matching NimoOS-Build/scripts/deploy.sh.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
